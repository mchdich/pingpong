# Deploy this fork as a separate app. The original fly.toml targets the Poddle owner's app.
app = "pingpong-mehdi-ch"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  ROOM_CAP = "40"
  SITE_URL = "https://pingpong.mehdi.ch"
  ULTIMATES = "1"
